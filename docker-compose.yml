services:
  postgres:
    image: postgres:16-alpine
    container_name: system-monitoring-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: "${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}"
      POSTGRES_DB: system_monitoring
    # No published port: the database is reachable only from the app container.
    # For local debugging: docker compose exec postgres psql -U user system_monitoring
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d system_monitoring"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: system-monitoring-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Loopback only. On a server the dashboard is published by the production
      # overlay through Caddy over TLS; this mapping is just for local work and
      # for `curl` on the host. Binding 0.0.0.0 here would expose the site over
      # plain http and let anyone bypass the reverse proxy.
      - "127.0.0.1:8090:8080"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PASSWORD: "${DATABASE_PASSWORD:?set DATABASE_PASSWORD in .env}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      TEAM_PASSWORD: "${TEAM_PASSWORD:-}"
      SESSION_SECRET: "${SESSION_SECRET:-}"
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-127.0.0.1}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_NOTIFY: "${TELEGRAM_NOTIFY:-false}"
      TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
      TELEGRAM_ADMIN_CHAT: "${TELEGRAM_ADMIN_CHAT:-}"
      DASHBOARD_URL: "${DASHBOARD_URL:-}"
      SCHEDULER_TIME: "${SCHEDULER_TIME:-10:00}"
      RUN_NOW: "${RUN_NOW:-false}"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    networks:
      - app-network
    dns:
      - 8.8.8.8
      - 1.1.1.1

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
